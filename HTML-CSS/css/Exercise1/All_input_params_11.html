<!DOCTYPE html><html>
    <head>
        <title>Contact Form</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="icon" type="image/x-icon" href="images/favicon-32x32.png">
        <link rel="stylesheet" href="css/style.css">

    </head>
    <body>
        <div class="container">
            <h1>Courier Form</h1>
            <form>
                <div class="span1">
            <label for="fullName">Username:</label>
            <input type="text" name="fullName" value="" placeholder="Username" required> 
            <br>
            <br>
            <label for="password" >password</label>
            <input type="password" name="password" value="" placeholder="password" required><br>
            <br>
            <br>
            <label for="email">Email:</label>
            <input type="email" name="password" value="" placeholder="Email" required><br>
            <br>
            <br>
            <label for="file">Upload a file:</label>
            <input type="file" name="file" value="" placeholder=".pdf .jpg files allowed" required><br>
            <br>
            <br>
            <label for="address">Address:</label>
            <Textarea cols="20%" rows="3" placeholder="door no,street" required></Textarea><br>
            <br>
            <br>
            <label for="quantity">Quantity</label>
            <input type="number" name="quantity" value="" placeholder="Quantity" required><br>
            <br>
            <br>
            <label for="gender">Full name:</label><br>
            <input type="radio" name="gender" value="M">M <br>
            <input type="radio" name="gender" value="F">F<br>
            <input type="radio" name="gender" value="NA">NA<br>
            <br>
            <br>
            <label for="lang">Language Known:</label><br>
            <input type="checkbox" name="lang" value="English">English <br>
            <input type="checkbox" name="lang" value="Japanese">Japanese <br>
            <input type="checkbox" name="lang" value="Spanish">Spanish<br>
            <br>
            <br>

            <label for="telephone">Telephone</label>
            <input type="tel" name="telephone" value="" placeholder="+910000000000" required><br>
            <br>
            <br>

            <label for="date">Date to dispatch:</label>
            <input type="date" name="date" value="" placeholder="dd-mm-yyyy" required><br>
            <br>
            <br>

            <input type="submit" value="Submit">
            <input type="reset" value="Reset">
           </div>

        </form>
        </div>
    </body>
</html>
