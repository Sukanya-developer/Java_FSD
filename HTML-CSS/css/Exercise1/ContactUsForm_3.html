<html>

<head>
    <title>Contact Form</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="images/favicon-32x32.png">
    <link rel="stylesheet" href="css/style.css">
    
</head>

<body>
    <script>
        function myFunction() {
          alert("We will contact you shortly");
        }
        </script> 

    <div class="container">
        <h1>Get In Touch</h1>
        <form onsubmit="myFunction()">
            <div class="span1">
                <label for="fname">First Name</label>
                <input type="text" name="fname" value="" Placeholder="First Name" required></div>
                <div class="span1"> <label for="lname">Last Name</label>
                <input type="text" name="lname" value="" Placeholder="Last Name" required></div> 
                <div class="span1"><label for="email">&nbsp;&nbsp;&nbsp;&nbsp;Email ID</label>
                <input type="email" name="email" value="" Placeholder="Email" required></div>
                <div class="span1">   <label for="phone">Contact No</label>
                <input type="tel" name="phone" value="" Placeholder="+910000000000" range="+[0-9]{9}" required></span>
            
            <div class="span1">
            <label for="message" style="display: inline;">Message&nbsp;</label>
            <textarea name="message" cols="22%" rows="5" required></textarea></div>
            <input type="submit" value="Submit" class="btn1">

        </form>
    </div>
</body>

</html>
