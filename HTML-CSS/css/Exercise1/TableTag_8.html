


    <!DOCTYPE html>
<html>
<head>
<style>
  /* Basic styling for the form */
  .form-container {
    background-color: #222;
    color: white;
    padding: 20px;
    border-radius: 5px;
    width:80%;
  }

  input[type="text"], input[type="tel"] {
    width: 100%;
    padding: 10px;
    margin-bottom: 10px;
    border: 1px solid #ccc;
    background-color:rgba(247, 247, 247, .13);
    border-radius: 3px;
  }

  input[type="submit"] {
    background-color: #ffc107;
    color: black;
    padding: 10px 20px;
    border: none;
    border-radius: 3px;
    cursor: pointer;
    width: 100%;
  }

  .name:hover{
    color:black;
  }
  span{
    background-color: lightblue;
  }
  .outerlayer{
    margin-right: 10%;
    padding:0px;
   # bcolor:#ffc107 !important;
  }
</style>
</head>
<body>
<span class="outerlayer">
    
   
<div class="form-container">
  <h2 style="text-align: center;"><strong>ENTER YOUR DETAILS BELOW</strong></h2>
  <p style="text-align: center;">TO GET COMPLETE INFORMATION OR WE WILL CALL YOU</p>
  
  <form>
    
    <input type="text" class="name" name="name" placeholder="Your Name" required>

    <input type="tel" id="phone" name="phone" placeholder="Phone No" required>

    <input type="submit" value="Submit">
  </form>
</div> 
</span>
</body>
</html>
